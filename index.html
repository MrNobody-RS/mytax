<style>
:root{
  /* layout: form column on the left, sticky result ledger on the right; one column on phones with a fixed balance bar */
  --bg:#f3f5f4; --surface:#ffffff; --ink:#14231f; --muted:#5b6b66; --line:#d5dcd9;
  --accent:#0b6b57; --accent-soft:#dcefe9; --field:#f8faf9;
  --good:#1d7a46; --warn:#a15c00; --warn-soft:#fbeed3; --bad:#b3261e; --bad-soft:#f9dedc;
  --display:"Bricolage Grotesque","Noto Sans SC",system-ui,sans-serif;
  --body:"IBM Plex Sans","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1715; --surface:#17211e; --ink:#e7efec; --muted:#9bb0a9; --line:#2c3a36;
    --accent:#58c9ab; --accent-soft:#16332c; --field:#111a18;
    --good:#6bd08f; --warn:#f0b65a; --warn-soft:#3a2c12; --bad:#ff8a80; --bad-soft:#3d1a18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#17211e; --ink:#e7efec; --muted:#9bb0a9; --line:#2c3a36;
  --accent:#58c9ab; --accent-soft:#16332c; --field:#111a18;
  --good:#6bd08f; --warn:#f0b65a; --warn-soft:#3a2c12; --bad:#ff8a80; --bad-soft:#3d1a18;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-bottom:84px}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 32px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-family:var(--display);font-size:clamp(26px,5vw,38px);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;padding:7px 12px;background:transparent}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:920px){.grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)} .result{position:sticky;top:14px;align-self:start;order:2} body{padding-bottom:0} .bar{display:none}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
details.sec,.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:10px;align-items:baseline;justify-content:space-between}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h2{font-family:var(--display);font-size:19px;margin:0}
details.sec>summary .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.hint{color:var(--muted);font-size:13px;margin:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center}
.row label{min-width:0}
.row small{display:block;color:var(--muted);font-size:12px}
input[type=text]{width:100%;font:inherit;font-variant-numeric:tabular-nums;text-align:right;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
.chk{display:flex;gap:10px;align-items:flex-start}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.grp{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--field)}
.grp-h{display:flex;gap:8px;justify-content:space-between;align-items:baseline;flex-wrap:wrap}
.grp-h strong{font-weight:600}
.grp-h .lim{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:0}
.meter.full i{background:var(--warn)}
.grp-f{display:flex;gap:8px;justify-content:space-between;font-size:12px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.over{color:var(--warn);font-weight:600}
.cat{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 -2px}
.card{padding:16px}
.result h2{font-family:var(--display);font-size:19px;margin:0 0 4px}
.big{font-family:var(--display);font-size:clamp(34px,7vw,46px);line-height:1.05;font-variant-numeric:tabular-nums;margin:2px 0}
.big.refund{color:var(--good)} .big.pay{color:var(--warn)}
.tag{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:last-child{text-align:right;white-space:nowrap;padding-left:10px}
tr.t td{font-weight:600;border-bottom:2px solid var(--ink)}
tr.m td{color:var(--muted)}
.scroll{overflow-x:auto}
.bands{display:flex;flex-direction:column;gap:6px}
.band{display:grid;grid-template-columns:118px minmax(0,1fr) 84px;gap:8px;align-items:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.band .trk{height:10px;background:var(--line);border-radius:3px;overflow:hidden}
.band .trk i{display:block;height:100%;background:var(--accent)}
.band.off{color:var(--muted)}
.band span:last-child{text-align:right}
.flags{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.flags li{padding:8px 10px;border-radius:8px;font-size:13px;border-left:4px solid var(--warn);background:var(--warn-soft)}
.flags li.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.flags li.ok{border-left-color:var(--good);background:var(--accent-soft)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.kv div{border:1px solid var(--line);border-radius:10px;padding:10px}
.kv b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--muted)}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
footer{color:var(--muted);font-size:12.5px;margin-top:22px;max-width:75ch}
footer p{margin:0 0 6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);display:flex;justify-content:space-between;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums;z-index:5}
.bar small{display:block;opacity:.75;font-size:11.5px}
.bar b{font-family:var(--display);font-size:20px}
.bar div:last-child{text-align:right}
.kv small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.mini{font-size:12px;padding:3px 9px;border-radius:999px;border-color:var(--accent);color:var(--accent);background:transparent;white-space:nowrap}
.mini:hover{background:var(--accent-soft)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions button{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:600}
.actions button.alt{background:transparent;color:var(--accent)}
.stamp{display:none;text-align:right;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:rgba(10,18,16,.72);display:none;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:20}
.modal.on{display:flex}
.modal .box{background:var(--surface);border-radius:12px;padding:14px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:10px}
.modal img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;display:block}
.modal .mrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.modal a.dl{display:inline-block;text-decoration:none;font-weight:600;background:var(--accent);color:var(--surface);padding:8px 14px;border-radius:8px}
@media print{
  body{background:#fff;padding:0;font-size:12px}
  .tools,#form,.bar,.actions,.modal,.sub{display:none !important}
  .grid{display:block}.result{position:static}.card{border:0;padding:0}
  .stamp{display:block}.wrap{padding:0;max-width:none}
}
@media (min-width:920px){.bar{display:none}}
@media (max-width:420px){.row{grid-template-columns:minmax(0,1fr) 122px}.band{grid-template-columns:96px minmax(0,1fr) 74px}}
@media (prefers-reduced-motion:no-preference){.meter i,.band .trk i{transition:width .2s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="sub"></p>
    </div>
    <div class="tools">
      <span class="pill" id="exPill" data-t="exPill"></span>
      <div class="seg" role="group" aria-label="Language">
        <button type="button" id="langEn" aria-pressed="true">EN</button>
        <button type="button" id="langZh" aria-pressed="false">中文</button>
      </div>
      <button type="button" id="btnClear" data-t="clear"></button>
      <button type="button" id="btnExample" data-t="example"></button>
    </div>
  </header>

  <div class="grid">
    <section class="col result" aria-live="polite">
      <div class="card">
        <div class="stamp" id="stamp"></div>
        <h2 data-t="resTitle"></h2>
        <div class="tag" id="balLabel"></div>
        <div class="big" id="balBig"></div>
        <div class="kv">
          <div><b id="kCI"></b><span data-t="kCI"></span></div>
          <div><b id="kTax"></b><span data-t="kTax"></span></div>
          <div><b id="kEff"></b><span data-t="kEff"></span><small data-t="kEffS"></small></div>
          <div><b id="kMar"></b><span data-t="kMar"></span><small data-t="kMarS"></small></div>
        </div>
        <div class="actions">
          <button type="button" id="btnImg" data-t="saveImg"></button>
          <button type="button" id="btnPdf" class="alt" data-t="savePdf"></button>
        </div>
        <h3 data-t="hComp"></h3>
        <div class="scroll"><table id="comp"></table></div>
        <h3 data-t="hRel"></h3>
        <div class="scroll"><table id="relTab"></table></div>
        <h3 data-t="hBands"></h3>
        <div class="bands" id="bands"></div>
        <h3 data-t="hFlags"></h3>
        <ul class="flags" id="flags"></ul>
      </div>
    </section>

    <section class="col" id="form"></section>
  </div>

  <footer>
    <p data-t="f1"></p><p data-t="f2"></p><p data-t="f3"></p>
  </footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="box">
    <div class="mrow"><strong id="mTitle" data-t="mTitle"></strong><button type="button" id="mClose" data-t="mClose"></button></div>
    <img id="mImg" alt="">
    <p class="hint" data-t="mHint"></p>
    <div class="mrow"><a class="dl" id="mDl" data-t="mDl"></a></div>
  </div>
</div>

<div class="bar" aria-hidden="true">
  <div><small data-t="kTax"></small><b id="barTax"></b></div>
  <div><small id="barLabel"></small><b id="barBal"></b></div>
</div>

<script>
/* ===== PURE-START ===== */
const P = {
  ya: 2026,
  bands: [[0,0],[5000,.01],[20000,.03],[35000,.06],[50000,.11],[70000,.19],[100000,.25],[400000,.26],[600000,.28],[2000000,.30]],
  rebThr: 35000, rebSelf: 400, rebSpouse: 400, donPct: .10, divThr: 100000,
  self: 9000, disSelf: 7000, spouse: 4000, disSpouse: 6000,
  c1: 2000, c2: 2000, c3: 8000, c4: 8000, c5: 8000,
  hlP1: 500000, hlC1: 7000, hlP2: 750000, hlC2: 5000,
  groups: [
    {id:'parents', cat:'health', cap:8000,  items:[['HP1',null],['HP2',1000]]},
    {id:'health',  cat:'health', cap:10000, items:[['HS1',null],['HS2',null],['HS3',1000],['HS4',1000],['HS5',1000],['HS6',10000]]},
    {id:'EQ1', cat:'health', cap:6000, items:[['EQ1',null]]},
    {id:'edu', cat:'life', cap:7000, items:[['ED1',null],['ED2',2000]]},
    {id:'LS1', cat:'life', cap:2500, items:[['LS1',null]]},
    {id:'SP1', cat:'life', cap:1000, items:[['SP1',null]]},
    {id:'TR1', cat:'life', cap:1000, items:[['TR1',null]]},
    {id:'GR1', cat:'life', cap:2500, items:[['GR1',null]]},
    {id:'CC1', cat:'child', cap:3000, items:[['CC1',null]]},
    {id:'SS1', cat:'child', cap:8000, items:[['SS1',null]]},
    {id:'BF1', cat:'child', cap:1000, items:[['BF1',null]]},
    {id:'IN2', cat:'ins', cap:4000, items:[['IN2',null]]},
    {id:'IN5', cat:'ins', cap:350,  items:[['IN5',null]]},
    {id:'IN1', cat:'ins', cap:3000, items:[['IN1',null]]},
    {id:'IN4', cat:'ins', cap:4000, items:[['IN4',null]]},
    {id:'IN3', cat:'ins', cap:3000, items:[['IN3',null]]},
    {id:'HL1', cat:'home', cap:null, items:[['HL1',null]]}
  ]
};
const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
function taxOn(ci){
  let t = 0; const out = [];
  P.bands.forEach((b, i) => {
    const up = i + 1 < P.bands.length ? P.bands[i + 1][0] : Infinity;
    const inc = Math.max(Math.min(ci, up) - b[0], 0);
    const tx = r2(inc * b[1]); t += tx;
    out.push({lo: b[0], up, rate: b[1], inc, tax: tx});
  });
  return {tax: r2(t), bands: out};
}
function compute(v){
  const n = k => +v[k] || 0;
  const emp = Math.max(n('empGross') + n('empBik') - n('empDed'), 0);
  const rent = Math.max(n('rentGross') - n('rentExp'), 0);
  const rentLoss = Math.max(n('rentExp') - n('rentGross'), 0);
  const agg = emp + n('biz') + rent + n('interest') + n('other');
  const don = Math.min(n('DON'), r2(P.donPct * agg));
  const total = agg - don;
  const status = [
    ['self', P.self],
    ['disSelf', v.disSelf ? P.disSelf : 0],
    ['spouse', Math.min(P.spouse, (v.spouse ? P.spouse : 0) + n('alimony'))],
    ['disSpouse', v.spouse && v.disSpouse ? P.disSpouse : 0],
    ['c1', n('c1') * P.c1], ['c2', n('c2') * P.c2], ['c3', n('c3') * P.c3],
    ['c4', n('c4') * P.c4], ['c5', Math.min(n('c5'), n('c4')) * P.c5]
  ];
  const hlCap = !v.hl ? 0 : n('hlPrice') <= P.hlP1 ? P.hlC1 : n('hlPrice') <= P.hlP2 ? P.hlC2 : 0;
  const groups = P.groups.map(g => {
    const cap = g.cap === null ? hlCap : g.cap;
    let spent = 0, counted = 0;
    g.items.forEach(([c, sub]) => { const a = n(c); spent += a; counted += sub === null ? a : Math.min(a, sub); });
    const claim = Math.min(counted, cap);
    return {id: g.id, cap, spent, claim, lost: r2(spent - claim)};
  });
  const relStatus = status.reduce((s, x) => s + x[1], 0);
  const relPaid = groups.reduce((s, g) => s + g.claim, 0);
  const reliefs = r2(relStatus + relPaid);
  const ci = Math.max(r2(total - reliefs), 0);
  const tb = taxOn(ci);
  const rebSelf = ci <= P.rebThr ? P.rebSelf : 0;
  const rebSpouse = ci <= P.rebThr && v.spouse ? P.rebSpouse : 0;
  const rebates = Math.min(rebSelf + rebSpouse + n('ZKT') + n('levy'), tb.tax);
  const net = r2(tb.tax - rebates);
  const paid = n('pcb') + n('cp500');
  const balance = r2(net - paid);
  let mar = 0; P.bands.forEach(b => { if (ci >= b[0]) mar = b[1]; });
  return {emp, rent, rentLoss, agg, don, donPaid: n('DON'), total, status, relStatus, relPaid, reliefs, groups, ci,
          tax: tb.tax, bands: tb.bands, rebSelf, rebSpouse, zakat: n('ZKT'), levy: n('levy'), rebates, net, paid, balance,
          eff: agg ? net / agg : 0, mar, lost: r2(groups.reduce((s, g) => s + g.lost, 0)), div: n('div'), biz: n('biz')};
}
const EXAMPLE = {empGross:108000, biz:6000, rentGross:18000, rentExp:7500, div:3000, c1:1, pcb:7800,
  HP1:2350, HP2:1200, HS3:95, HS4:2130, HS5:780, ED2:1800, LS1:4773.5, SP1:1260, TR1:264, CC1:2400, SS1:3600,
  IN1:2640, IN2:11880, IN3:3000, IN4:2880, IN5:414.6, DON:500};
/* ===== PURE-END ===== */

const T = {
  title:['Malaysia Tax Calculator YA 2026','马来西亚个人所得税计算器 2026 课税年'],
  sub:['For a tax-resident individual, income earned in 2026 and filed in 2027. Enter what you paid in full. The limits are applied for you.','适用于税务居民个人，2026 年收入，2027 年报税。请填写实际支付的全额，系统会自动套用扣除上限。'],
  exPill:['Example figures','示例数字'], clear:['Clear all','全部清空'], example:['Load example','载入示例'],
  resTitle:['Your result','计算结果'], kCI:['Chargeable income','应课税收入'], kTax:['Tax for the year','全年税额'],
  kEff:['Effective rate','实际税率'], kMar:['Marginal rate','边际税率'],
  hComp:['Computation','计算明细'], hBands:['Tax by band','各税阶税额'], hFlags:['Points to check','注意事项'],
  balPay:['Balance of tax to pay','尚需补缴税款'], balRef:['Tax overpaid, refund due','多缴税款，可获退税'], balNil:['Nothing more to pay','无需补缴'],
  barPay:['To pay','需补缴'], barRef:['Refund','退税'],
  sIncome:['Income','收入'], sFamily:['You and your family','个人与家庭'], sRelief:['Reliefs for amounts paid','按支出申请的扣除'], sPaid:['Donations, zakat and tax paid','捐款、天课与已缴税款'],
  hIncome:['Use the figures on your EA form. Business income is entered after expenses.','请使用 EA 表格上的数字。生意收入请填扣除费用后的净额。'],
  hFamily:['These reliefs depend on your status, not on receipts.','这些扣除取决于个人状况，无需收据。'],
  hRelief:['Type the total you paid for each item in 2026. Keep every receipt for 7 years.','请填写 2026 年每个项目的支付总额。所有收据须保存 7 年。'],
  empGross:['Employment income, gross','雇佣收入（总额）'], empBik:['Benefits in kind','实物福利'], empDed:['Employment deductions','雇佣收入可扣除项'],
  empDedS:['Such as professional subscriptions','例如专业团体会费'],
  biz:['Business or freelance income, net','生意或自由职业收入（净额）'], bizS:['After expenses and capital allowances','已扣除费用及资本免税额'],
  rentGross:['Rental income, gross','租金收入（总额）'], rentExp:['Rental expenses','租金相关费用'], rentExpS:['Assessment, quit rent, loan interest, repairs, insurance','门牌税、地税、贷款利息、维修、保险'],
  interest:['Taxable interest','应课税利息'], other:['Other taxable income','其他应课税收入'],
  div:['Dividends received (not taxed here)','已收股息（此处不计税）'],
  disSelf:['I am a registered disabled individual','本人为注册残障人士'], spouse:['Claim spouse relief','申请配偶扣除'],
  spouseS:['Spouse has no income, or joint assessment in your name','配偶无收入，或以您的名义合并评税'],
  disSpouse:['My spouse is disabled','配偶为残障人士'], alimony:['Alimony paid to former wife','支付前妻的赡养费'],

function makeImage(r, when){
  const W = 1080, PADX = 60, RIGHT = W - PADX, DISP = '"Bricolage Grotesque","Noto Sans SC",sans-serif', BODY = '"IBM Plex Sans","Noto Sans SC",sans-serif';
  const INK = '#14231f', MUT = '#5b6b66', LINE = '#d5dcd9', ACC = '#0b6b57', GOOD = '#1d7a46', WARN = '#a15c00';
  const cv = document.createElement('canvas'); let ctx = cv.getContext('2d');
  const wrap = (text, font, maxW) => {
    ctx.font = font; const toks = lang ? Array.from(text) : text.split(' '); const lines = []; let cur = '';
    toks.forEach(tok => { const nxt = cur ? cur + (lang ? '' : ' ') + tok : tok; if (ctx.measureText(nxt).width > maxW && cur) { lines.push(cur); cur = tok; } else cur = nxt; });
    if (cur) lines.push(cur); return lines;
  };
  const ops = []; let y = 0;
  const text = (s, x, yy, font, col, align) => ops.push(c => { c.font = font; c.fillStyle = col; c.textAlign = align || 'left'; c.fillText(s, x, yy); });
  const rule = (yy, col, w) => ops.push(c => { c.fillStyle = col; c.fillRect(PADX, yy, W - 2 * PADX, w || 1); });
  y = 84; text(t('title'), PADX, y, '700 40px ' + DISP, INK);
  text(stampText(when), RIGHT, 44, '400 20px ' + BODY, MUT, 'right');
  y += 64; text(r.balance < 0 ? t('balRef') : r.balance > 0 ? t('balPay') : t('balNil'), PADX, y, '400 24px ' + BODY, MUT);
  y += 70; text('RM ' + fmt(Math.abs(r.balance)), PADX, y, '700 68px ' + DISP, r.balance < 0 ? GOOD : r.balance > 0 ? WARN : INK);
  y += 44; text(t('kCI') + ' RM ' + fmt0(r.ci) + '   ·   ' + t('kEff') + ' ' + (r.eff * 100).toFixed(1) + '%   ·   ' + t('kMar') + ' ' + (r.mar * 100).toFixed(0) + '%', PADX, y, '400 22px ' + BODY, MUT);
  const table = (title, rows) => {
    y += 62; text(title.toUpperCase(), PADX, y, '600 20px ' + BODY, ACC); y += 14; rule(y, INK, 2);
    rows.forEach(([lab, val, bold]) => {
      const f = (bold ? '600' : '400') + ' 25px ' + BODY; const lines = wrap(lab, f, W - 2 * PADX - 240);
      lines.forEach((ln, i) => { y += 36; text(ln, PADX, y, f, INK); if (i === 0) text(fmt(val), RIGHT, y, f, INK, 'right'); });
      y += 13; rule(y, bold ? INK : LINE, bold ? 2 : 1);
    });
  };
  table(t('hComp'), compRows(r));
